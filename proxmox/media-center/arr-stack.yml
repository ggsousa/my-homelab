# Media Automation Stack - ggsousa HomeLab
# Services: qBittorrent, Radarr, Sonarr, Jackett

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
    volumes:
      - /path/to/appdata/qbittorrent:/config
      - /mnt/media/downloads:/downloads # Mapping to your VM storage
    ports:
      - 8080:8080
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /path/to/appdata/radarr:/config
      - /mnt/media/movies:/movies # Your Movies folder
      - /mnt/media/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  # Sonarr follows the same pattern on port 8989
